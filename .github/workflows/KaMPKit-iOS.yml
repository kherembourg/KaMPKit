name: KaMPKit-iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"
      - "*.png"
      - docs
      - app

jobs:
  build:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-15-intel' || 'personal-ci-macos-arm64' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests (Intel pull request runner)
        if: github.event_name == 'pull_request'
        run: ./gradlew :shared:iosX64Test

      - name: Run tests (Apple Silicon personal runner)
        if: github.event_name != 'pull_request'
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build
        uses: sersoft-gmbh/xcodebuild-action@v1
        with:
          project: ios/KaMPKitiOS.xcodeproj
          scheme: KaMPKitiOS
          sdk: iphoneos
          configuration: Debug
          action: build
          use-xcpretty: false
          build-settings: CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO
